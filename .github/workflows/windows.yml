name: Windows

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.18.1
  RUST_VERSION: 1.97.1
  CARGO_TERM_COLOR: always

jobs:
  build-windows-installer:
    name: Test and build Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal --component clippy --component rustfmt
          rustup default $env:RUST_VERSION
          rustc --version --verbose
          cargo --version

      - name: Cache Cargo dependencies and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ env.RUST_VERSION }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ env.RUST_VERSION }}-

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend quality gates
        run: npm run check

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features

      - name: Build NSIS installer
        run: npm run tauri -- build --bundles nsis

      - name: Verify installer output
        shell: pwsh
        run: |
          $installer = "src-tauri/target/release/bundle/nsis/VisualCover_0.1.0_x64-setup.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "Expected installer was not produced: $installer"
          }
          New-Item -ItemType Directory -Force -Path "dist-windows" | Out-Null
          Copy-Item -LiteralPath $installer -Destination "dist-windows/VisualCover_0.1.0_x64-setup.exe"

      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: VisualCover-0.1.0-windows-x64-installer
          path: dist-windows/VisualCover_0.1.0_x64-setup.exe
          if-no-files-found: error
          retention-days: 14
